<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCE4EC" />
      <stop offset="50%" stop-color="#F8C8DC" />
      <stop offset="100%" stop-color="#F48FB1" />
    </linearGradient>
    <linearGradient id="avatarGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E75480" />
      <stop offset="100%" stop-color="#C2185B" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#C2185B" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Background circle with smooth blush tint -->
  <rect width="400" height="400" rx="200" fill="url(#bgGradient)" />

  <!-- Subtle concentric orbit rings -->
  <circle cx="200" cy="200" r="185" fill="none" stroke="#FFFFFF" stroke-opacity="0.6" stroke-width="2" stroke-dasharray="8 6" />
  <circle cx="200" cy="200" r="155" fill="none" stroke="#E75480" stroke-opacity="0.2" stroke-width="1.5" />

  <!-- Silhouette / Portrait Placeholder -->
  <!-- Shoulders -->
  <path d="M100 350 C100 270, 150 245, 200 245 C250 245, 300 270, 300 350 Z" fill="url(#avatarGradient)" opacity="0.9" filter="url(#shadow)" />
  <!-- Head -->
  <circle cx="200" cy="180" r="58" fill="url(#avatarGradient)" filter="url(#shadow)" />

  <!-- Monogram Initials Badge -->
  <circle cx="200" cy="180" r="46" fill="#FFFFFF" opacity="0.96" />
  <text x="200" y="193" font-family="'Inter', -apple-system, sans-serif" font-size="34" font-weight="800" fill="#C2185B" text-anchor="middle" letter-spacing="1">MG</text>

  <!-- Clean label tag at the bottom -->
  <g transform="translate(100, 320)">
    <rect width="200" height="38" rx="19" fill="#FFFFFF" filter="url(#shadow)" />
    <text x="100" y="24" font-family="'Inter', -apple-system, sans-serif" font-size="12" font-weight="700" fill="#E75480" text-anchor="middle" letter-spacing="0.5">MERYEM GLIOUEZ</text>
  </g>
</svg>
